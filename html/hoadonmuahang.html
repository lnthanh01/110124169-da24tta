<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hóa đơn mua hàng</title>
    <link rel="stylesheet" href="../css/style4.css">
</head>
<body>

<h2>HÓA ĐƠN MUA HÀNG</h2>

<table id="invoice">
    <thead>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Số lượng</th>
            <th>Đơn giá</th>
            <th>Thành tiền</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>A</td>
            <td class="sl">3</td>
            <td class="dg">1000</td>
            <td class="tt">0</td>
        </tr>
        <tr>
            <td>B</td>
            <td class="sl">4</td>
            <td class="dg">2000</td>
            <td class="tt">0</td>
        </tr>
        <tr>
            <td>C</td>
            <td class="sl">7</td>
            <td class="dg">3000</td>
            <td class="tt">0</td>
        </tr>
        <tr>
            <td>D</td>
            <td class="sl">10</td>
            <td class="dg">3000</td>
            <td class="tt">0</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="3" style="text-align:right;font-weight:bold">Tổng</td>
            <td id="tongtien">0</td>
        </tr>
    </tfoot>
     
</table>

<script src="../js/lib.js"></script>
</body>
</html>
