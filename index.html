<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mở Link</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #9dd0dd;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #00bfa6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            transition: 0.3s;
        }

        a:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
    </style>

</head>
<body>

    <h1>Bấm vào link bên dưới</h1>

    <a href="html/page.html" target="_blank">Đi tới profile</a>

</body>
</html>
